name: Live model check

# Real hermes-agent + HermesCloak against a real model (default Ollama Cloud), synthetic data only.
# Start it by adding the `live-test` label to a PR, or (once merged to main) from the Actions tab.
# Needs the repository secret OLLAMA_API_KEY (or OLLAMA_TEST_KEY).
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model name at the endpoint"
        default: "gpt-oss:120b"
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'live-test')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY || secrets.OLLAMA_TEST_KEY }}
      HC_LIVE_MODEL: ${{ inputs.model || vars.HC_LIVE_MODEL || 'gpt-oss:120b' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check secret
        run: |
          if [ -z "$OLLAMA_API_KEY" ]; then
            echo "::error::Repository secret OLLAMA_API_KEY (or OLLAMA_TEST_KEY) is not set (Settings → Secrets and variables → Actions)"
            exit 1
          fi
      - name: Live sandbox (offline e2e + real model)
        run: bash install/live_sandbox.sh
