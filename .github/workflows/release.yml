name: release

# Creates the GitHub release (and its v<version> tag) when the version in plugin.yaml reaches main
# and CHANGELOG.md has a section for it. Re-running is a no-op once the release exists.
on:
  push:
    branches: [main]
    paths: [plugin.yaml, pyproject.toml, CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Which version
        run: |
          v=$(sed -n 's/^version: *"\{0,1\}\([0-9][0-9.]*\)"\{0,1\} *$/\1/p' plugin.yaml)
          p=$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' pyproject.toml)
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "no version in plugin.yaml" >&2; exit 1; }
          [ "$v" = "$p" ] || { echo "plugin.yaml ($v) and pyproject.toml ($p) disagree" >&2; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Already released?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "v$VERSION is already released"; echo "SKIP=1" >> "$GITHUB_ENV"; fi
      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"
      - name: Test before releasing
        if: env.SKIP != '1'
        run: pip install -e '.[dev]' && python -m pytest -q
      - name: Release notes from CHANGELOG.md
        if: env.SKIP != '1'
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $VERSION" >&2; exit 1; }
      - name: Create the release and its tag
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "HermesCloak v$VERSION" --notes-file notes.md
