name: release

# Creates the GitHub release (and its v<version> tag) when the version in plugin.yaml reaches main
# and CHANGELOG.md has a section for it. Re-running is a no-op once the release exists.
# Tests run in a read-only job; only the last job, which runs no third-party code, can write.
on:
  push:
    branches: [main]
    paths: [plugin.yaml, pyproject.toml, CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.known.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Which version
        id: v
        run: |
          v=$(sed -n 's/^version: *"\{0,1\}\([0-9][0-9.]*\)"\{0,1\} *$/\1/p' plugin.yaml)
          p=$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' pyproject.toml)
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "no version in plugin.yaml" >&2; exit 1; }
          [ "$v" = "$p" ] || { echo "plugin.yaml ($v) and pyproject.toml ($p) disagree" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Already released?
        id: known
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION is already released"; echo "release=no" >> "$GITHUB_OUTPUT"
          else
            echo "release=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        if: steps.known.outputs.release == 'yes'
        with:
          python-version: "3.12"
      - name: Test before releasing
        if: steps.known.outputs.release == 'yes'
        run: pip install -e '.[dev]' && python -m pytest -q
      - name: Release notes from CHANGELOG.md
        if: steps.known.outputs.release == 'yes'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $VERSION" >&2; exit 1; }

  release:
    needs: check
    if: needs.check.outputs.release == 'yes'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Create the release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          gh release create "v$VERSION" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "HermesCloak v$VERSION" --notes-file notes.md
