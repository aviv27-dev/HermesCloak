# Example HermesCloak profile. Copy + adapt per deployment; the live profile lives at
# $HERMES_HOME/cloak/profile.yaml and is NOT part of this repo. Edits apply live (no restart);
# a broken edit is ignored (last good version kept, `config_error` in the audit log).
profile: example
languages: [he, en]
fail_mode: open            # open (default): on an internal filter error send unfiltered + audit
                           # closed: withhold the text instead (the turn fails, nothing leaks)
alerts:
  channel: telegram
  on: [unfiltered_sent, leftover_token]
never_mask:                # entities to never tokenize (avoid over-masking)
  - "בית המשפט"
  - "לשכת ההוצאה לפועל"
token_instruction: true    # tell the cloud model how to treat ⟦TYPE_N⟧ tokens
detect_secrets: true       # mask API keys / tokens / private keys / password=... values
tolerant_restore: true     # also restore lightly mangled tokens: ⟦לקוח 1⟧, [לקוח_1], ⟨מייל_2⟩
                           # (only when that exact token exists in the vault)
replay_cache: true         # send the model's own earlier turns back byte-identically
                           # (prompt cache + Claude thinking-signature safe)
audit_new_pii: true        # audit (counts only) PII the model introduced or masked values it echoed
vault_ttl_hours: 24        # the token map expires this long after its last new entry
# entity_source is wired by the adapter layer:
#   generic users -> a StaticFileSource("names.txt")  ($HERMES_HOME/cloak/gazetteer.txt)
#   firm deployment -> a custom DB-backed EntitySource (lives in the adapter, not core)
