[project]
name = "hermescloak"
version = "0.3.0"
description = "Reversible PII pseudonymization for Hermes LLM agents (contained placeholder lifecycle)."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["pyyaml>=6.0.1"]

[project.optional-dependencies]
# Minimums are the first releases with no known CVE (pip-audit, October 2026).
# Hebrew NER via DictaBERT (CC BY 4.0 model — see NOTICE). Loaded only by the optional NER service.
ner = ["transformers>=5.10", "torch>=2.13"]
# Encryption at rest for the durable vault (Fernet).
crypto = ["cryptography>=50.0"]
dev = ["pytest>=9.0.3", "cryptography>=50.0"]

# hermes-agent discovers pip-installed plugins through this group (opt-in: `hermes plugins enable hermescloak`).
[project.entry-points."hermes_agent.plugins"]
hermescloak = "hermescloak.hermes_plugin:register"

[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hermescloak*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
