# hermes-agent directory-plugin manifest. Install with:
#   hermes plugins install aviv27-dev/HermesCloak --enable
# python_runtime: external — hermes' package manager installs nothing for this plugin and leaves the
# repository's pyproject.toml alone, so the runtime environment hermes SHARES between all agents is never
# rebuilt with HermesCloak inside. The package loads from this directory (see __init__.py).
name: hermescloak
version: "0.2.1"
description: >-
  Reversible PII pseudonymization for hermes-agent: identifying values (Hebrew-first) are replaced
  with ⟦TYPE_N⟧ tokens before any request reaches a cloud model and restored on the way back.
author: aviv27-dev
manifest_version: 2
api_version: 1
python_runtime: external
